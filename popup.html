<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; width: 260px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 7px 12px; margin-right: 6px; cursor: pointer; border: none; border-radius: 4px; }
    #renameBtn { background: #1a73e8; color: white; }
    #resetBtn { background: #e0e0e0; }
    #status { font-size: 12px; color: green; margin-top: 6px; }
  </style>
</head>
<body>
  <strong>Rename This Tab</strong>
  <input type="text" id="tabName" placeholder="Enter new tab name..." />
  <div>
    <button id="renameBtn">Rename</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
